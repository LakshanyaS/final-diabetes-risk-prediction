name: diabetes_risk_app
description: Diabetes Risk Prediction — Live ML inference via Flask API
publish_to: none
version: 2.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  # UI & fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Charts
  fl_chart: ^0.68.0
  # HTTP — NEW: calls the Flask API
  http: ^1.2.0
  # PDF generation & sharing
  pdf: ^3.10.8
  printing: ^5.13.1
  # File & share
  path_provider: ^2.1.3
  share_plus: ^9.0.0
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
